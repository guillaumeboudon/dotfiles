name: mipise
root: ~/

startup_window: mipise

windows:
  - music:
      root: <%= ENV["HOME"] %>/Music
      layout: main-vertical
      panes:
        - cmus
        -

  - dotfiles:
      root: <%= ENV["HOME"] %>/.dotfiles

  - mipise:
      root: <%= ENV["CODE_ROOT"] %>/mipise/mipise
      layout: main-vertical
      panes:
        -
        -

  - mps:
      root: <%= ENV["CODE_ROOT"] %>/mipise/mps
      layout: main-vertical
      panes:
        -
        -
